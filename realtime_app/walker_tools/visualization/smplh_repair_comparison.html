<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人体运动</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#25312e;font:13px system-ui,"Microsoft YaHei",sans-serif}button,select,input{font:inherit;color:inherit}button,select,input[type=number]{border:1px solid #c8cecb;border-radius:5px;background:#fff;padding:5px 8px}button,select,summary{cursor:pointer}button:hover,summary:hover{background:#f0f3f1}input[type=checkbox],input[type=range]{accent-color:#46695d}#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}#app[hidden]{display:none}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #dde2de}h1{font-size:15px;font-weight:600;white-space:nowrap;margin:0 10px 0 0}#play{min-width:52px}label{display:flex;align-items:center;gap:5px;white-space:nowrap}#frame{width:65px}#seek{flex:1;min-width:100px;margin:0}#clock{font-variant-numeric:tabular-nums;color:#67716d;white-space:nowrap}.scene{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}.display{position:absolute;right:14px;top:14px;z-index:2;background:#ffffffed;border:1px solid #d9dfdb;border-radius:7px;min-width:70px}.display summary{padding:7px 10px}.checks{display:grid;gap:9px;padding:5px 13px 13px}.hint{position:absolute;bottom:12px;left:14px;color:#66716b;font-size:11px;pointer-events:none;background:#ffffffba;padding:4px 7px;border-radius:4px}footer{position:relative;background:#fff;border-top:1px solid #dde2de;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px;font-size:12px;color:#66716b}#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer summary{white-space:nowrap;list-style:none}footer summary::-webkit-details-marker{display:none}.info{position:absolute;right:14px;bottom:35px;width:min(370px,calc(100vw - 28px));padding:12px 14px;background:#fff;border:1px solid #d9dfdb;border-radius:7px;color:#35433c;box-shadow:0 4px 18px #0000000a}#quality{font:12px/1.7 system-ui,"Microsoft YaHei",sans-serif;white-space:pre-wrap;margin:0;max-height:50vh;overflow:auto}.legend{margin-top:9px;font-size:11px;color:#707a73}.green{color:#087970}.orange{color:#a26b1f}#loading{padding:30px}@media(max-width:650px){header{gap:7px;padding:8px 10px}h1{margin-right:auto}#seek{order:2;flex-basis:65%}#clock{order:3;font-size:11px}.hint{font-size:10px;left:8px;bottom:8px}footer{padding:6px 10px}}
</style>
<div id="loading" role="status">正在加载人体运动…</div>
<div id="app" hidden>
  <header>
    <h1>人体运动</h1>
    <button id="play">播放</button>
    <select id="rate" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <label>帧 <input id="frame" aria-label="帧号" type="number" min="0" max="447" value="61"></label>
    <input id="seek" aria-label="帧进度" type="range" min="0" max="447" value="61">
    <span id="clock"></span>
    <select id="view" aria-label="视角"><option value="recommended">默认视角</option><option value="side">侧视</option><option value="front">正视</option><option value="top">俯视</option></select>
  </header>
  <main class="scene">
    <canvas id="scene" aria-label="修正后人体、地面与助步器三维视图"></canvas>
    <details class="display"><summary>显示</summary><div class="checks">
      <label><input id="mesh" type="checkbox" checked>人体表面</label>
      <label><input id="raw" type="checkbox" checked>观测骨架</label>
      <label><input id="model" type="checkbox" checked>模型观察点</label>
      <label><input id="walker" type="checkbox" checked>助步器与相机</label>
      <label><input id="trails" type="checkbox" checked>运动轨迹</label>
      <label><input id="sole" type="checkbox">足底标记</label>
    </div></details>
    <div class="hint">拖动旋转 · 右键 / Shift 拖动平移 · 滚轮缩放</div>
  </main>
  <footer><span id="status"></span><details><summary>帧信息 ⓘ</summary><div class="info">
    <pre id="quality"></pre>
    <div class="legend">黑线：三角化观测　<span class="green">绿点：模型观察点</span><br><span class="orange">橙叉：严格门拒绝</span>　红点：足底在参考地面下<br>修正后候选 · 参考地面非独立触地真值 · 原帧直显</div>
  </div></details></footer>
</div>
<script src="viewer.js"></script>
</html>
